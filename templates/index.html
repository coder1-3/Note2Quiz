<!DOCTYPE html>
<html lang="en">
<head>
    <title>Note2Quiz | Upload</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h1>📝 Note2Quiz</h1>
        <p class="subtitle">Transform your study notes into interactive quizzes.</p>
        
        <form method="POST" enctype="multipart/form-data" class="upload-zone">
            <div class="upload-icon">📄</div>
            <h3>Select a TXT file to begin</h3>
            <input type="file" name="note_file" accept=".txt" required>
            <button type="submit" class="btn primary-btn" style="margin-top: 20px;">Proceed to Setup</button>
        </form>
    </div>
</body>
</html>
